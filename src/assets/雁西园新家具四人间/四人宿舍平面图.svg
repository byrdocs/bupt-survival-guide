<desc>
	平面几何以厘米建模，两图均使用1厘米对应1.8 SVG单位。已标尺寸按标注跨度严格绘制，约数按名义值绘制。墙厚、门宽、未标家具和卫浴尺寸为估绘，非实测施工图。四张床为上床下桌高架床，均按长206厘米、宽90厘米同比例绘制。衣柜位于床下，以虚线轮廓示意，不占用或分割床的长度；衣柜宽按70厘米绘制。椅子宽约50厘米，置于床侧衣柜与桌区之间。梯子为爬上上铺的床侧梯：俯视自床长边伸入通道，两侧梯梁、竖线示踏棍；通道「约 90」为左右两梯外缘净距。
	</desc>
